name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ADSENSE_ENABLED: "false"
      PUBLIC_GOOGLE_ADSENSE_ACCOUNT: ${{ vars.PUBLIC_GOOGLE_ADSENSE_ACCOUNT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate content
        run: npm run validate

      - name: Test source contracts
        run: node --experimental-strip-types --test tests/ad-placement.test.mjs tests/source-contract.test.mjs tests/content-quality.test.mjs tests/validate-script.test.mjs

      - name: Type check
        run: npm run check

      - name: Validate advertising configuration
        run: node -e "const enabled = process.env.PUBLIC_ADSENSE_ENABLED; const account = (process.env.PUBLIC_GOOGLE_ADSENSE_ACCOUNT ?? '').trim(); if (enabled !== 'false') { console.error('::error::PUBLIC_ADSENSE_ENABLED must remain false during review preparation.'); process.exit(1); } if (account && !/^ca-pub-[0-9]{16}$/.test(account)) { console.error('::error::PUBLIC_GOOGLE_ADSENSE_ACCOUNT must be empty or a valid account value.'); process.exit(1); }"

      - name: Build production site
        run: npm run build

      - name: Audit AdSense readiness
        run: npm run audit:adsense

      - name: Test generated site
        run: npm run test:built

      - name: Set Worker release tag
        id: worker-release-tag
        shell: bash
        run: echo "tag=release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload production Worker version
        run: npx wrangler versions upload --env="" --tag "${{ steps.worker-release-tag.outputs.tag }}"

      - name: Promote production Worker version
        run: npx wrangler versions deploy --env="" --version-tag "${{ steps.worker-release-tag.outputs.tag }}" --yes
